    function startQuiz() {
          currentQuestion = 0;
    userAnswers = [];

        document.getElementById("quiz").classList.remove("hidden");

        document.querySelector(".card > h2").style.display = "none";
        document.querySelector(".card > p").style.display = "none";
        document.querySelector(".card > button").style.display = "none";

        showQuestion();
    }

    function showQuestion() {
        document.getElementById("question").textContent =
            questions[currentQuestion].question;

        document.getElementById("answers").innerHTML =
            questions[currentQuestion].answers.map(option => `
                <button onclick="selectAnswer('${option[0]}')">
                    ${option[0]} ${option[1]}
                </button>
            `).join("");
    }

    function selectAnswer(answer) {
        userAnswers.push(answer);

        currentQuestion++;

        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {

    let bestBooks = [];
    let bestScore = -1;

    books.forEach(book => {
        if (book.available === 0) return;

        let score = 0;

        for (let i = 0; i < userAnswers.length; i++) {

            // Pregunta 11: las respuestas son cosas que queremos EVITAR
            if (i === 10) {

                if (book.code[i].includes(userAnswers[i])) {
                    score -= 3;
                }

            } else {

                if (book.code[i].includes(userAnswers[i])) {
                    score++;
                }

            }
        }

        if (score > bestScore) {
            bestScore = score;
            bestBooks = [book];
        } 
        else if (score === bestScore) {
            bestBooks.push(book);
        }
    });

    document.getElementById("question").textContent =
        "¡Tu Book Match es! 📚✨";

    document.getElementById("answers").innerHTML = `
        <h2>${bestBooks.map(book => book.name).join(" + ")}</h2>
        <p>
            Compatibilidad: ${bestScore}
        </p>
    `;

    console.log("Respuestas:", userAnswers);
}
