<!DOCTYPE html>

    <style>

        .card {

        }

        button {
            background-color: #2f2f2f;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            opacity: 0.85;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    function startQuiz() {
        document.getElementById("quiz").classList.remove("hidden");

        document.querySelector(".card > h2").style.display = "none";
        document.querySelector(".card > p").style.display = "none";
        document.querySelector(".card > button").style.display = "none";

        showQuestion();
    }

    function showQuestion() {
        document.getElementById("question").textContent =
            questions[currentQuestion].question;

        document.getElementById("answers").innerHTML =
            questions[currentQuestion].answers.map(option => `
                <button onclick="selectAnswer('${option[0]}')">
                    ${option[0]} ${option[1]}
                </button>
            `).join("");
    }

    function selectAnswer(answer) {
        userAnswers.push(answer);

        currentQuestion++;

        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {

    let bestBook = null;
    let bestScore = -1;

    books.forEach(book => {

        let score = 0;

        for (let i = 0; i < userAnswers.length; i++) {

            if (book.code[i].includes(userAnswers[i])) {
                score++;
            }

        }

        if (score > bestScore) {
            bestScore = score;
            bestBook = book;
        }
    });

    document.getElementById("question").textContent =
        "¡Tu Book Match es! 📚✨";

    document.getElementById("answers").innerHTML = `
        <h2>${bestBook.name}</h2>
        <p>
            Coincidencias: ${bestScore} de 12
        </p>
    `;

    console.log("Respuestas:", userAnswers);
}

</script>

</html>
